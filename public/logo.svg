<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" fill="none">
  <defs>
    <!-- Gradiente principal magenta -> violeta -->
    <linearGradient id="vp-grad-a" x1="0" y1="0" x2="80" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a1c8a"/>
      <stop offset="0.5" stop-color="#9c2bc8"/>
      <stop offset="1" stop-color="#ff2e92"/>
    </linearGradient>
    <linearGradient id="vp-grad-b" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a2caa"/>
      <stop offset="0.6" stop-color="#c93a98"/>
      <stop offset="1" stop-color="#ff4aaa"/>
    </linearGradient>
    <linearGradient id="vp-shine" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Símbolo: V formado por 2 play-triangles arredondados -->
  <g transform="translate(8, 8)">
    <!-- Play da esquerda (parte de trás) -->
    <path
      d="M 6 12
         Q 6 4 14 9
         L 56 44
         Q 64 50 56 56
         L 14 91
         Q 6 96 6 88
         Z"
      fill="url(#vp-grad-a)"
    />
    <!-- Play da direita (parte da frente, ligeiramente deslocado) -->
    <path
      d="M 30 12
         Q 30 4 38 9
         L 80 44
         Q 88 50 80 56
         L 38 91
         Q 30 96 30 88
         Z"
      fill="url(#vp-grad-b)"
    />
    <!-- Brilho/highlight -->
    <path
      d="M 30 12
         Q 30 4 38 9
         L 80 44
         Q 88 50 80 56
         L 38 91
         Q 30 96 30 88
         Z"
      fill="url(#vp-shine)"
    />
    <!-- Reflexo central -->
    <ellipse cx="58" cy="36" rx="14" ry="3" fill="white" opacity="0.25" filter="url(#soft)"/>
  </g>

  <!-- Wordmark: "Verti" bold + "play" light -->
  <g font-family="-apple-system, 'SF Pro Display', system-ui, sans-serif" font-style="normal">
    <text x="115" y="74" font-weight="800" font-size="64" fill="white" letter-spacing="-2.5">Verti</text>
    <text x="240" y="74" font-weight="300" font-size="64" fill="white" letter-spacing="-1.5">play</text>
  </g>
</svg>
