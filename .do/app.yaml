# Vertiplay — DigitalOcean App Platform
# Sobe direto do GitHub agf3xdev/vertiplay.
# Domínio custom (vertiplay.diogoarchanjo.com.br) é adicionado em segundo passo,
# depois que o CNAME estiver propagando no Registro.br.
name: vertiplay
region: nyc
services:
  - name: web
    git:
      repo_clone_url: https://github.com/agf3xdev/vertiplay.git
      branch: main
    dockerfile_path: Dockerfile
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 3030
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 15
    envs:
      - { key: NODE_ENV, value: production }
      - { key: NEXT_PUBLIC_APP_NAME, value: Vertiplay }
      - { key: NEXT_PUBLIC_APP_URL, value: "https://vertiplay.diogoarchanjo.com.br" }
      - { key: NEXT_TELEMETRY_DISABLED, value: "1" }
